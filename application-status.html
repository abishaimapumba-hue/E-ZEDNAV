<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Check the status and feedback for an E-ZEDNAV school application." />
    <title>Application status | E-ZEDNAV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand" aria-label="E-ZEDNAV home page">
          <span class="brand-mark">E</span>
          E-ZEDNAV
        </a>
        <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="schools.html">Schools</a>
          <a href="map.html">Map</a>
          <a href="services.html">Services</a>
          <a href="about.html">About</a>
        </nav>
        <a href="schools.html" class="btn btn-primary nav-cta">Browse schools</a>
      </div>
    </header>
    <main>
      <section class="page-hero">
        <div class="container">
          <p class="eyebrow">APPLICATION FOLLOW-UP</p>
          <h1>Check your application.</h1>
          <p>Enter the reference number you received and the email address used on the application.</p>
        </div>
      </section>
      <section class="page-shell">
        <div class="container">
          <section class="form-box">
            <form id="applicationStatusForm">
              <label>
                Application reference
                <input type="text" name="reference" required maxlength="64" autocomplete="off" />
              </label>
              <label>
                Email address
                <input type="email" name="email" required maxlength="254" autocomplete="email" />
              </label>
              <button class="btn btn-primary" type="submit">Check status</button>
              <p id="applicationStatusMessage" class="form-status" role="status" aria-live="polite"></p>
              <section id="applicationStatusResult" class="application-status-result" aria-live="polite" hidden>
                <h2 id="applicationStatusHeading"></h2>
                <p id="applicationFeedback"></p>
              </section>
            </form>
          </section>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container footer-wrap">
        <a href="index.html" class="brand footer-brand"><span class="brand-mark">E</span>E-ZEDNAV</a>
        <nav class="footer-nav" aria-label="Footer links">
          <a href="schools.html">Schools</a><a href="map.html">Map</a><a href="services.html">Services</a><a href="about.html">About</a>
        </nav>
        <p>© <span id="year"></span> E-ZEDNAV. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
